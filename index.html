<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Open and configure your local Cortex installation.">
		<meta name="color-scheme" content="dark">
		<title>Cortex</title>
		<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
		<link rel="stylesheet" href="assets/css/style.css">
		<link rel="stylesheet" href="assets/css/auth-parity.css">
		<script defer src="assets/js/script.js"></script>
	</head>
	<body>
		<main class="redirect-page" data-local-launcher data-product="cortex" data-default-host="localhost" data-default-port="7331">
			<section class="redirect-card" aria-labelledby="redirect-title">
				<div class="auth-brand"><span class="mark">C</span><span class="eyebrow">Cortex</span></div>
				<div class="redirect-error" data-redirect-error role="alert" hidden></div>
				<form class="redirect-form" data-redirect-form novalidate>
					<label for="cortex-host">Domain or IP</label>
					<input id="cortex-host" name="host" type="text" inputmode="url" autocomplete="url" value="localhost" placeholder="localhost or https://cortex.example.com" spellcheck="false">
					<label for="cortex-port">Port</label>
					<input id="cortex-port" name="port" type="number" min="1" max="65535" step="1" inputmode="numeric" autocomplete="off" value="7331">
					<div class="redirect-actions redirect-actions-inline">
						<button class="primary" type="submit">Save</button>
						<button class="secondary" type="button" data-reset-target>Use defaults</button>
					</div>
					<button class="primary open-button" type="button" data-open-target>Open</button>
				</form>
				<p class="redirect-status" data-redirect-status>Preparing Cortex…</p>
			</section>
		</main>
	</body>
</html>
